name: Deploy Static Tourism Atlas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'static-atlas/**'
      - 'client/public/**'
      - '.github/workflows/deploy-static-webgis.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        shell: bash
        run: |
          mkdir -p _site
          cp -a client/public/. _site/
          cp static-atlas/index.html _site/index.html
          touch _site/.nojekyll
          test -f _site/data/natural-atlas-with-media_5ccb1fb0.geojson
          test -f _site/data/world-heritage_ae1639b4.kml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
