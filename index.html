<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أطلس ليبيا السياحي | Web GIS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#143c50;background:#f2f5f5}*{box-sizing:border-box}body{margin:0}header{background:#123c52;color:white;padding:17px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{margin:0;font-size:23px}header p{margin:5px 0 0;color:#d4e0e6;font-size:13px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:60px;max-height:58px;object-fit:contain}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100dvh - 92px)}aside{padding:18px;background:#fff;overflow:auto;max-height:calc(100dvh - 92px);box-shadow:0 0 12px #103b5020;z-index:450}h2{font-size:17px;margin:12px 0}input,select{font:inherit;padding:11px;width:100%;border:1px solid #bbc9cd;border-radius:9px;margin-bottom:10px}.layer{display:flex;align-items:center;gap:9px;padding:9px 6px;border-bottom:1px solid #e7eeee;cursor:pointer}.layer input{width:auto;margin:0}.layer small{margin-right:auto;color:#677985}.btn{background:#123c52;border:0;border-radius:8px;color:white;padding:10px 14px;cursor:pointer}button.secondary{background:#eaf0f3;color:#123c52}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}#map{width:100%;height:calc(100dvh - 92px);min-height:460px}#status{padding:8px 0;font-size:12px;min-height:25px;color:#5d6e74}.result{padding:10px;border-bottom:1px solid #e4eced;cursor:pointer}.result:hover{background:#e9f3f4}.result strong{display:block}.result small{color:#63747a}.legend{display:flex;align-items:center;gap:8px}.dot{width:12px;height:12px;display:inline-block;border-radius:50%}footer{font-size:12px;color:#677985;margin-top:20px}#error{color:#af3838} @media(max-width:800px){header h1{font-size:18px}.layout{display:flex;flex-direction:column}aside{max-height:none}#map{height:58dvh;min-height:350px;order:-1}}
</style></head><body><header><div class="brand"><img src="assets/atlas-project-logo-approved.png" alt="شعار أطلس ليبيا" onerror="this.style.display='none'"><div><h1>أطلس ليبيا السياحي</h1><p>مركز المعلومات والتوثيق السياحي — خريطة تفاعلية مستقلة</p></div></div><span>LIBYA GIS · 2026</span></header><div class="layout"><aside><h2>البحث في المواقع السياحية</h2><input id="search" type="search" placeholder="اسم الموقع أو المدينة أو التصنيف" aria-label="بحث"><div class="actions"><button class="btn" id="showall">إظهار جميع الطبقات</button><button class="btn secondary" id="hideall">إخفاء الطبقات</button><button class="btn secondary" id="reset">عرض ليبيا</button></div><h2>طبقات الأطلس</h2><div id="layers"></div><div id="status" role="status"></div><h2>النتائج <span id="count"></span></h2><div id="results"></div><footer>تُقرأ البيانات مباشرة من ملفات KML وGeoJSON دون API أو قاعدة بيانات تشغيلية. الخرائط الأساسية من مزود خارجي.</footer></aside><main><div id="map" aria-label="خريطة ليبيا السياحية"></div></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const configs=[
{id:'heritage',label:'التراث العالمي',file:'world-heritage_ae1639b4.kml',type:'kml',color:'#b96d3b'},
{id:'natural',label:'الموارد الطبيعية',file:'natural-atlas-with-media_5ccb1fb0.geojson',type:'geojson',color:'#287a70'},
{id:'akakus',label:'تادرارت أكاكوس',file:'akakus_60c47b41.kml',type:'kml',color:'#a76027'},
{id:'old-tripoli',label:'المدينة القديمة طرابلس',file:'old-tripoli_5c62867b.kml',type:'kml',color:'#3e7183'},
{id:'hotels',label:'الفنادق والإيواء',file:'hotels_b9547235.kml',type:'kml',color:'#b34b42'},
{id:'resorts',label:'القرى والمنتجعات',file:'resorts_e4a8f065.kml',type:'kml',color:'#3d8c8a'},
{id:'investment',label:'فرص الاستثمار',file:'investment_de22d4a0.kml',type:'kml',color:'#af7a24'},
{id:'food',label:'المطاعم والمقاهي',file:'restaurants_0642e048.kml',type:'kml',color:'#855d42'}];
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([27.2,17.2],5);L.control.zoom({position:'topright'}).addTo(map);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const carto=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© OpenStreetMap © CARTO'});let mapStyle='osm';
L.control.layers({'OpenStreetMap':osm,'CARTO Light':carto},null,{position:'topleft'}).addTo(map);
const cache=new Map(),active=new Set(),groups=new Map();const searchEl=document.getElementById('search'),layersEl=document.getElementById('layers'),resultsEl=document.getElementById('results'),statusEl=document.getElementById('status');
function strip(s){return String(s??'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()}
function parseCoordinates(raw){return String(raw||'').trim().split(/\s+/).map(part=>part.split(',').map(Number)).filter(v=>v.length>=2&&Number.isFinite(v[0])&&Number.isFinite(v[1])).map(v=>[v[0],v[1]])}
function parseKML(text){const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw Error('Invalid KML');const features=[];
const get=(node,name)=>{const el=Array.from(node.getElementsByTagName('*')).find(n=>n.localName===name);return el?.textContent?.trim()||''};
for(const placemark of Array.from(xml.getElementsByTagName('*')).filter(n=>n.localName==='Placemark')){const properties={name:get(placemark,'name'),description:strip(get(placemark,'description'))};for(const x of Array.from(placemark.getElementsByTagName('*')).filter(n=>n.localName==='Data')){const key=x.getAttribute('name');if(key)properties[key]=get(x,'value')}
let geometries=[];for(const geom of Array.from(placemark.getElementsByTagName('*')).filter(n=>['Point','LineString','Polygon'].includes(n.localName))){let geometry=null;
if(geom.localName==='Point'){const coords=parseCoordinates(get(geom,'coordinates'));if(coords[0])geometry={type:'Point',coordinates:coords[0]}}
if(geom.localName==='LineString'){const coords=parseCoordinates(get(geom,'coordinates'));if(coords.length>=2)geometry={type:'LineString',coordinates:coords}}
if(geom.localName==='Polygon'){const rings=[];for(const boundary of Array.from(geom.getElementsByTagName('*')).filter(n=>n.localName==='outerBoundaryIs'||n.localName==='innerBoundaryIs')){const ring=parseCoordinates(get(boundary,'coordinates'));if(ring.length>=4)rings.push(ring)}if(!rings.length){const ring=parseCoordinates(get(geom,'coordinates'));if(ring.length>=4)rings.push(ring)}if(rings.length)geometry={type:'Polygon',coordinates:rings}}
if(geometry)geometries.push(geometry)}for(const geometry of geometries)features.push({type:'Feature',properties,geometry})}
return {type:'FeatureCollection',features}}
async function readLayer(c){if(cache.has(c.id))return cache.get(c.id);const res=await fetch('data/'+encodeURIComponent(c.file));if(!res.ok)throw Error(`HTTP ${res.status}: ${c.file}`);const data=c.type==='kml'?parseKML(await res.text()):await res.json();if(data.type!=='FeatureCollection'||!Array.isArray(data.features))throw Error('Invalid GeoJSON');cache.set(c.id,data);return data}
function popup(feature,c){const p=feature.properties||{};const name=p.name_ar||p.name||p.title||p.name_en||'موقع سياحي';const root=document.createElement('div');const title=document.createElement('strong');title.textContent=strip(name);root.appendChild(title);const desc=document.createElement('p');desc.textContent=strip(p.description_ar||p.description||'').slice(0,500);root.appendChild(desc);const source=document.createElement('small');source.textContent=c.label;root.appendChild(source);return root}
function draw(c,data){const layer=L.geoJSON(data,{style:{color:c.color,weight:2,fillOpacity:.2},pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:6,color:'#fff',weight:1.5,fillColor:c.color,fillOpacity:.95}),onEachFeature:(f,l)=>l.bindPopup(popup(f,c))});groups.set(c.id,layer);layer.addTo(map)}
async function toggle(c,enable){const check=document.getElementById('layer-'+c.id);if(!enable){active.delete(c.id);groups.get(c.id)?.removeFrom(map);if(check)check.checked=false;renderSearch();return}active.add(c.id);if(check)check.checked=true;try{if(!groups.has(c.id)){statusEl.textContent='جارٍ تحميل: '+c.label;draw(c,await readLayer(c))}groups.get(c.id).addTo(map);statusEl.textContent='تم تحميل الطبقات المختارة'}catch(e){active.delete(c.id);if(check)check.checked=false;statusEl.textContent='تعذّر تحميل '+c.label+': '+e.message;console.error(e)}renderSearch()}
function centerOf(f){const geom=f.geometry;if(!geom)return null;if(geom.type==='Point')return [geom.coordinates[1],geom.coordinates[0]];const coords=[];function walk(a){if(typeof a?.[0]==='number'&&typeof a?.[1]==='number'){coords.push(a);return}if(Array.isArray(a))a.forEach(walk)}walk(geom.coordinates);if(!coords.length)return null;let lo=Infinity,la=Infinity,hi=-Infinity,ha=-Infinity;for(const [x,y]of coords){lo=Math.min(lo,x);hi=Math.max(hi,x);la=Math.min(la,y);ha=Math.max(ha,y)}return [(la+ha)/2,(lo+hi)/2]}
function renderSearch(){const q=searchEl.value.trim().toLocaleLowerCase();resultsEl.replaceChildren();let hits=[];for(const c of configs.filter(x=>active.has(x.id))){for(const [i,f]of (cache.get(c.id)?.features||[]).entries()){const p=f.properties||{};if(q&&!Object.values(p).some(v=>String(v??'').toLocaleLowerCase().includes(q)))continue;hits.push({f,c,i})}}document.getElementById('count').textContent=`(${hits.length.toLocaleString('ar-LY')})`;for(const {f,c}of hits.slice(0,80)){const name=strip(f.properties?.name_ar||f.properties?.name||f.properties?.title||'موقع سياحي');const el=document.createElement('div');el.className='result';el.tabIndex=0;const strong=document.createElement('strong');strong.textContent=name;const small=document.createElement('small');small.textContent=c.label;el.append(strong,small);const act=()=>{const ll=centerOf(f);if(ll)map.flyTo(ll,Math.max(10,map.getZoom()));};el.onclick=act;el.onkeydown=e=>{if(e.key==='Enter')act()};resultsEl.appendChild(el)}if(hits.length>80){const note=document.createElement('small');note.textContent='تظهر أول 80 نتيجة. استخدم البحث لتضييق النتائج.';resultsEl.appendChild(note)}}
for(const c of configs){const label=document.createElement('label');label.className='layer';const input=document.createElement('input');input.type='checkbox';input.id='layer-'+c.id;input.onchange=()=>toggle(c,input.checked);const dot=document.createElement('span');dot.className='dot';dot.style.background=c.color;const name=document.createElement('span');name.textContent=c.label;label.append(input,dot,name);layersEl.appendChild(label)}
searchEl.oninput=renderSearch;document.getElementById('showall').onclick=()=>configs.forEach(c=>{if(!active.has(c.id))toggle(c,true)});document.getElementById('hideall').onclick=()=>configs.forEach(c=>toggle(c,false));document.getElementById('reset').onclick=()=>map.setView([27.2,17.2],5);window.addEventListener('resize',()=>map.invalidateSize());setTimeout(()=>map.invalidateSize(),100);
Promise.all(configs.filter(c=>['heritage','natural','hotels'].includes(c.id)).map(c=>toggle(c,true))).then(()=>{if(active.size===3)statusEl.textContent='تم تحميل الطبقات الافتراضية — Web GIS دون API';});
</script></body></html>
